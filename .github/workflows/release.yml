name: Release

# Builds installers and attaches them to a GitHub Release when you push a
# version tag:
#
#   npm version minor && git push --follow-tags
#
# Build and publish are deliberately separate. When each matrix job published
# for itself, the three jobs raced and each created its OWN draft release, so
# the assets ended up split across two drafts — publishing one of them shipped
# a release with no Windows build. Now every job only builds and uploads an
# artifact; a single job afterwards creates one draft and attaches everything.
#
# Windows is the shipped platform and must succeed. macOS and Linux are
# best-effort — they are unsigned and untested, so a failure there must not
# block the Windows upload.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            required: true
          - os: macos-latest
            required: false
          - os: ubuntu-latest
            required: false
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ !matrix.required }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build installers
        run: npx electron-builder --publish never
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p out
          # Installers only — skip unpacked build trees and debug output.
          # electron-builder names these with spaces ("Claude Multi Setup.exe");
          # normalise to hyphens, because `gh release create` rewrites spaces to
          # dots and users would download "Claude.Multi.Setup.1.21.1.exe".
          find dist -maxdepth 1 -type f \
            \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' \
               -o -name '*.blockmap' -o -name 'latest*.yml' \) \
            -print0 | while IFS= read -r -d '' f; do
              cp "$f" "out/$(basename "$f" | tr ' ' '-')"
            done
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: out/
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    # Runs as long as the Windows build produced something; a failed mac/linux
    # job must not stop the release.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Verify the Windows build is present
        run: |
          ls -la artifacts
          test -n "$(find artifacts -name '*.exe' -print -quit)" \
            || { echo '::error::No Windows installer produced — refusing to publish.'; exit 1; }
      - name: Create draft release with every artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --draft \
            --generate-notes \
            artifacts/*

  # Keep the README's version-pinned download links current, so they never lag
  # behind the latest tag. Runs only after a release was actually created.
  update-readme:
    name: Bump README download links
    needs: publish
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Rewrite version in the download table
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Updating README download links to $VERSION"
          sed -i -E \
            -e "s#releases/download/v[0-9]+\.[0-9]+\.[0-9]+/#releases/download/v${VERSION}/#g" \
            -e "s#Claude-Multi-Setup-[0-9]+\.[0-9]+\.[0-9]+\.exe#Claude-Multi-Setup-${VERSION}.exe#g" \
            -e "s#Claude-Multi-[0-9]+\.[0-9]+\.[0-9]+\.exe#Claude-Multi-${VERSION}.exe#g" \
            -e "s#Claude-Multi-[0-9]+\.[0-9]+\.[0-9]+-arm64\.dmg#Claude-Multi-${VERSION}-arm64.dmg#g" \
            -e "s#Claude-Multi-[0-9]+\.[0-9]+\.[0-9]+\.dmg#Claude-Multi-${VERSION}.dmg#g" \
            -e "s#Claude-Multi-[0-9]+\.[0-9]+\.[0-9]+\.AppImage#Claude-Multi-${VERSION}.AppImage#g" \
            README.md
      - name: Commit if the links changed
        run: |
          if git diff --quiet -- README.md; then
            echo "README already points at ${GITHUB_REF_NAME} — nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: bump README download links to ${GITHUB_REF_NAME} [skip ci]"
          git push origin main
